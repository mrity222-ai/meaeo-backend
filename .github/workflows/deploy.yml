name: Build, test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: autonomous-marketing-frontend-main/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/check_release_files.py
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: npm ci
        working-directory: autonomous-marketing-frontend-main
      - run: node --test tests/*.test.cjs
      - run: npm run build
        working-directory: autonomous-marketing-frontend-main
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            test -n "${!name}" || { echo "Missing deployment secret: $name"; exit 1; }
          done
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          command_timeout: 60m
          script: |
            set -eu
            cd /var/www/maeaco-system
            git fetch origin ${{ github.sha }}
            release_script=$(mktemp)
            trap 'rm -f "$release_script"' EXIT
            chmod 700 "$release_script"
            git show ${{ github.sha }}:scripts/deploy_release.py > "$release_script"
            python3 "$release_script" /var/www/maeaco-system ${{ github.sha }}
