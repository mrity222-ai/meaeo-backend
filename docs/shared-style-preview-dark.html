<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shared UI style preview</title><link rel="stylesheet" href="shared-style-preview.css"><style>main{max-width:1100px;margin:auto;padding:32px}h1{font-size:28px;font-weight:700}p{margin:8px 0 20px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.ui-card{padding:24px}.ui-metric{font-size:30px;font-weight:700;margin:16px 0}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:700px){.cards{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><h1>One shared UI style</h1><p>Design preview only — example values, no connected accounts.</p><div class="cards"><section class="ui-card"><h2>Reach</h2><div class="ui-metric">Not available</div><span class="ui-badge-neutral">No API data</span></section><section class="ui-card"><h2>Posts published</h2><div class="ui-metric">0</div><span class="ui-badge-neutral">Example value</span></section><section class="ui-card"><h2>Instagram</h2><p>Original platform colours stay separate from app styling.</p><span class="ui-badge-neutral">Not connected</span><div class="buttons"><button class="ui-button-primary">Connect account</button></div></section></div><div class="buttons"><button class="ui-button-primary">Primary action</button><button class="ui-button-secondary">Secondary action</button><button class="ui-button-primary" disabled>Disabled action</button></div></main></body></html>
