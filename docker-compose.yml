version: '3.8'

services:
  # 🗄️ PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: maeaco-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maeaco_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-maeaco_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maeaco_admin} -d ${POSTGRES_DB:-maeaco_prod_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ Redis Task Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: maeaco-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚙️ Python FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: maeaco-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-maeaco_admin}:${POSTGRES_PASSWORD:-SecurePassword123}@postgres:5432/${POSTGRES_DB:-maeaco_prod_db}
      - REDIS_URL=redis://redis:6379/0
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data/assets:/app/data/assets
      - ./generated/images:/app/generated/images
    expose:
      - "8000"

  # 🖥️ Next.js 15 Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://${BACKEND_DOMAIN:-api.maeaco.com}
        NEXT_PUBLIC_META_REDIRECT_URI: https://${BACKEND_DOMAIN:-api.maeaco.com}/api/v1/oauth/callback/meta
    container_name: maeaco-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "3000"

  # 🔒 Caddy Reverse Proxy & Automatic HTTPS SSL
  caddy:
    image: caddy:2-alpine
    container_name: maeaco-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-maeaco.com}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-api.maeaco.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
